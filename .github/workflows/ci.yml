# Integración continua (auditoría 2026-10-02, punto E5).
#
# Hasta este día las ~40 suites `scripts/prueba-*.js` existían pero dependían de
# que alguien se ACORDARA de correrlas. Este workflow las corre en cada push y en
# cada PR, más el build del frontend.
#
# ⚠️ Solo las suites que NO tocan red ni base: todas usan dobles. Se excluyen a
# propósito las que llaman a servicios reales —prueba-publico (gasta consultas
# a Places), prueba-culqi (API de Culqi), y las tres *-beta (SUNAT beta)—, que
# siguen siendo manuales. Comprobado el 2026-10-03 que las 39 restantes pasan
# con el entorno VACÍO y sin `.env`, que es como corren acá.
#
# ⚠️ Una suite que falla por FECHA (fixture con `new Date()`) es un bug de la
# suite, no del producto: pasó con prueba-cableado los días 1-3 de cada mes.
# Arreglarla fijando la fecha, nunca saltándola.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Prisma exige DATABASE_URL incluso para `validate` y para cargar el cliente,
    # aunque no se conecte. Es una URL FICTICIA: ninguna suite toca una base de
    # verdad (todas usan dobles). Sin ella, la primera corrida falló en
    # `prisma validate` con P1012 (2026-10-04).
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_sin_base
    defaults:
      run:
        working-directory: brand-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brand-shield/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      # El certificado de PRUEBA que necesitan las suites de firma (no el real).
      - run: node scripts/generar-cert-prueba.js
      - name: Suites sin red ni base
        run: |
          fallos=0
          for f in scripts/prueba-*.js; do
            n=$(basename "$f" .js)
            case "$n" in prueba-publico|prueba-culqi|prueba-sunat-beta|prueba-resumen-beta|prueba-baja-beta) continue;; esac
            if timeout 180 node "$f" > "/tmp/$n.log" 2>&1; then
              echo "✓ $n — $(tail -1 /tmp/$n.log)"
            else
              echo "::error::$n falló"; tail -30 "/tmp/$n.log"; fallos=$((fallos+1))
            fi
          done
          echo "Suites fallidas: $fallos"
          test "$fallos" -eq 0

  # Carreras contra un PostgreSQL DE VERDAD (réplica del auditor, 2026-10-07,
  # §59): los candados, el aislamiento y los abortos de transacción no se pueden
  # probar con dobles. La base es un contenedor desechable de este job; el script
  # se niega a correr contra cualquier base que no sea local y «test».
  integracion-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notoria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRACION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notoria_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notoria_test
    defaults:
      run:
        working-directory: brand-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brand-shield/package-lock.json
      - run: npm ci
      - run: node scripts/integracion-postgres.js

  # Venta de punta a punta contra el sandbox REAL de Culqi (réplica del auditor,
  # 2026-10-07, §6): registro → pago → renovación → comisión → reembolso +
  # webhook → reversión → bajada. Necesita las llaves de INTEGRACIÓN de Culqi
  # como secretos del repo (CULQI_PUBLIC_KEY_TEST / CULQI_SECRET_KEY_TEST); sin
  # ellos el job se salta con un aviso. El script se niega a correr con llaves live.
  e2e-venta:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notoria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notoria_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notoria_test
      CULQI_PUBLIC_KEY_TEST: ${{ secrets.CULQI_PUBLIC_KEY_TEST }}
      CULQI_SECRET_KEY_TEST: ${{ secrets.CULQI_SECRET_KEY_TEST }}
    defaults:
      run:
        working-directory: brand-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brand-shield/package-lock.json
      - run: npm ci
      - name: Sin llaves de integración de Culqi
        if: env.CULQI_SECRET_KEY_TEST == ''
        run: echo "::warning::e2e-venta saltado — faltan los secretos CULQI_PUBLIC_KEY_TEST / CULQI_SECRET_KEY_TEST"
      - name: Venta de punta a punta (Culqi integración)
        if: env.CULQI_SECRET_KEY_TEST != ''
        run: node scripts/e2e-venta.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand-shield-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brand-shield-web/package-lock.json
      - run: npm ci
      - run: npm run build
